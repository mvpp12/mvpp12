name: Update profile cards

on:
  schedule:
    - cron: "0 16 * * *"  # daily at 00:00 Philippine time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [generate.py, fetch_data.py, assets/**]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python fetch_data.py mvpp12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python generate.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json *.svg
          git diff --cached --quiet || git commit -m "Update profile cards"
          git push
